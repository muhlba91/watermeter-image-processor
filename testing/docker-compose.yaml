---
services:
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
  explorer:
    image: ghcr.io/thomasnordquist/mqtt-explorer:latest
    environment:
      - MQTT_EXPLORER_SKIP_AUTH=true
    ports:
      - "3000:3000"

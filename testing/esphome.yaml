---
# Reference device configuration for the watermeter camera, and the configuration CI compiles (with the
# dummy secrets from .ci/secrets.yaml): it includes the ESPHome package esphome/watermeter-camera.yaml
# and overrides its substitutions (see the package for all of them). The secrets are read from the
# secrets.yaml next to this file.
#
# Build and flash it with:
#   esphome run testing/esphome.yaml

substitutions:
  meter_id: water-meter # match this with METER_ID
  friendly_name: Water Meter # match this with METER_NAME
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  mqtt_broker_address: !secret mqtt_broker_address
  ota_password: !secret ota_password

packages:
  watermeter_camera: !include ../esphome/watermeter-camera.yaml
  # in another repository, include a released version instead:
  # watermeter_camera: github://muhlba91/watermeter-image-processor/esphome/watermeter-camera.yaml@<tag>
